name: Build MSI

# Construye el instalador MSI en un runner Windows con la misma receta que en
# local (scripts/package-windows.ps1), pero DESGLOSADA en pasos atómicos: si
# algo falla o se cuelga, el paso afectado lo delata de inmediato. Se puede
# llamar desde el workflow de release (workflow_call) o lanzar a mano para
# probar la cadena (workflow_dispatch). NO crea releases: deja el MSI como
# artefacto.

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref (tag, rama o SHA) que se construye. Vacío = el actual."
        type: string
        required: false
        default: ""
    outputs:
      version:
        description: "Versión construida (de tauri.conf.json)"
        value: ${{ jobs.build.outputs.version }}
      sha256:
        description: "SHA-256 del MSI"
        value: ${{ jobs.build.outputs.sha256 }}
      size:
        description: "Tamaño del MSI en bytes"
        value: ${{ jobs.build.outputs.size }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar MSI (Windows)
    runs-on: windows-latest
    timeout-minutes: 45   # guardarraíl global del job
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      size: ${{ steps.meta.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias npm (determinista)
        run: npm ci

      - name: Excluir el workspace del antivirus (acelera el build)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
            Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target')
            Write-Host 'Workspace excluido del antivirus.'
          } catch {
            Write-Host "No se pudo excluir del antivirus: $($_.Exception.Message)"
          }

      - name: 1. Licencia
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $ConfirmPreference = 'None'
          ./scripts/generate-license.ps1

      - name: 2. Graficos del asistente
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $ConfirmPreference = 'None'
          ./scripts/generate-installer-art.ps1

      - name: 3. Runtime embebido (Python + ffmpeg)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $ConfirmPreference = 'None'
          $ProgressPreference = 'SilentlyContinue'
          ./scripts/prepare-runtime.ps1

      - name: 4. Paquete de identidad (sparse msix)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $ConfirmPreference = 'None'
          ./scripts/package-appx.ps1

      - name: 5. Compilar el MSI (tauri build)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $ConfirmPreference = 'None'
          $tauri = Join-Path $PWD 'node_modules\.bin\tauri.cmd'
          if (-not (Test-Path -LiteralPath $tauri)) { throw "Falta $tauri (ejecuta npm ci)." }
          & $tauri build --bundles msi
          if ($LASTEXITCODE -ne 0) { throw "tauri build ha fallado (codigo $LASTEXITCODE)." }

      - name: 6. Post-proceso (tipografia) y copia a build/windows
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $ConfirmPreference = 'None'
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $msiDir = 'src-tauri/target/release/bundle/msi'
          $msi = Join-Path $msiDir "OpenWave_${version}_x64_es-ES.msi"
          if (-not (Test-Path -LiteralPath $msi)) {
            $msi = (Get-ChildItem -Path $msiDir -Filter '*.msi' -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          }
          if (-not $msi) { throw "No se genero ningun MSI en $msiDir" }
          ./scripts/msi-postprocess.ps1 -MsiPath $msi
          New-Item -ItemType Directory -Force -Path 'build/windows' | Out-Null
          Copy-Item -LiteralPath $msi -Destination "build/windows/OpenWave-$version-x64-es-ES.msi" -Force
          Write-Host "MSI final: build/windows/OpenWave-$version-x64-es-ES.msi"

      - name: 7. verify-msi (gate del payload)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $ConfirmPreference = 'None'
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          ./scripts/verify-msi.ps1 -MsiPath "build/windows/OpenWave-$version-x64-es-ES.msi"

      - name: 8. Leer version, hash y tamano del MSI
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $msi = "build/windows/OpenWave-$version-x64-es-ES.msi"
          if (-not (Test-Path -LiteralPath $msi)) { throw "No existe el MSI: $msi" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi).Hash.ToLower()
          $size = (Get-Item -LiteralPath $msi).Length
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          Write-Host "MSI ${version}: $size bytes, sha256 $hash"

      - name: 9. Subir el MSI como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: openwave-msi
          path: build/windows/OpenWave-*-x64-es-ES.msi
          if-no-files-found: error
          retention-days: 30
