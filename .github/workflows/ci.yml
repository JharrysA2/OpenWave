name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint + Format + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Expose npm failure logs as annotations (diagnostic)
        if: always()
        run: |
          logdir=""
          [ -n "$npm_config_cache" ] && logdir="$npm_config_cache/_logs"
          [ -z "$logdir" ] && logdir="$HOME/.npm/_logs"
          latest=$(ls -1t "$logdir" 2>/dev/null | head -1)
          echo "::warning::node $(node -v) / npm $(npm -v) | log=$logdir/$latest"
          if [ -n "$latest" ]; then
            f="$logdir/$latest"
            echo "::warning::log total lines: $(wc -l < "$f")"
            echo "::error::--- ERROR LINES ---"
            grep -aiE 'error|err!|enoent|not found|command|failed|exit' "$f" | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::--- LAST 30 NON-SILLY LINES ---"
            grep -av 'silly' "$f" | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          else
            echo "::error::no npm logs found in $logdir"
          fi

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build project
        run: npm run build

  backend:
    name: Backend (Ruff lint + format + Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -r backend/requirements.txt

      - name: Run ruff linter
        run: ruff check backend/

      - name: Check ruff formatting
        run: ruff format --check backend/

      - name: Run pytest
        run: |
          cd backend
          python -m pytest -v --timeout=30
