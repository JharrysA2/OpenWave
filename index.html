<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundWave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @property --neon {
        syntax: "<color>";
        inherits: true;
        initial-value: #a78bfa;
      }
      @keyframes sw-fade-slide-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes sw-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Apple Design: reduced motion = gentle cross-fades, not instant cuts */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.2s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.15s !important;
        }
        /* Reemplazar slide animations por fade simple */
        @keyframes sw-fade-slide-up {
          from { opacity: 0; transform: none; }
          to { opacity: 1; transform: none; }
        }
      }
      /* Apple Design: reduced transparency = solid backgrounds */
      @media (prefers-reduced-transparency: reduce) {
        .sidebar, .player-bar, .title-bar {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
      }

      /* ═══════════════════════════════════════════════════════════════════════
         SKELETON SHIMMER — Loading placeholder animation
         ═══════════════════════════════════════════════════════════════════════ */
      @keyframes skeleton-shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 12px var(--accent-color, #a78bfa) 55, 0 0 24px var(--accent-color, #a78bfa) 33; }
        50% { box-shadow: 0 0 20px var(--accent-color, #a78bfa) 77, 0 0 40px var(--accent-color, #a78bfa) 44; }
      }
      /* ═══════════════════════════════════════════════════════════════════════
         CONNECTION BANNER — punto pulsante mientras se reintenta
         ═══════════════════════════════════════════════════════════════════
         Reutiliza los keyframes `pulse` de arriba. */
      .connection-dot {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .connection-dot { animation: none !important; }
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          rgba(255,255,255,.04) 0%,
          rgba(255,255,255,.08) 50%,
          rgba(255,255,255,.04) 100%
        );
        background-size: 200% 100%;
        animation: skeleton-shimmer 1.8s ease-in-out infinite;
        border-radius: 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton { animation: none !important; background: rgba(255,255,255,.06) !important; }
      }

      /* ═══════════════════════════════════════════════════════════════════════
         LIQUID GLASS — Player Bar pseudo-element for subtle shine
         ════════════════════════════════════════════════════════════════════ */
      .player-bar {
        position: relative;
      }
      .player-bar::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40%;
        background: linear-gradient(
          180deg,
          rgba(255,255,255,.06) 0%,
          transparent 100%
        );
        border-radius: 20px 20px 0 0;
        pointer-events: none;
        z-index: 0;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         PERFORMANCE MODES — applied on <html> by PerformanceContext
         These !important rules override INLINE styles from React.
         ═══════════════════════════════════════════════════════════════════════ */
      html.perf-blur-off *, html.perf-blur-off *::before, html.perf-blur-off *::after {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        filter: none !important;
      }
      html.perf-anim-off *, html.perf-anim-off *::before, html.perf-anim-off *::after {
        animation: none !important;
        animation-play-state: paused !important;
      }
      html.perf-shadow-off *, html.perf-shadow-off *::before, html.perf-shadow-off *::after {
        box-shadow: none !important;
      }
      html.perf-solid [style*="backdrop-filter"] {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: color-mix(in srgb, var(--neon) 18%, var(--bg-base, #0a0a0f)) !important;
      }
      /* SOLID ? buttons keep a visible accent border so they stand out
         against the solid background (GLASS.btn / close buttons use blur(6px)) */
      html.perf-solid [style*="blur(6px)"] {
        border: 1px solid color-mix(in srgb, var(--neon) 45%, rgba(255,255,255,.35)) !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         APP HIDDEN — window minimized / covered / backgrounded.
         Option A (aggressive): pause/remove ALL effects while music keeps
         playing. Animations resume where they left off (paused, not killed).
         ═══════════════════════════════════════════════════════════════════════ */
      html.app-hidden *, html.app-hidden *::before, html.app-hidden *::after {
        animation-play-state: paused !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        filter: none !important;
        box-shadow: none !important;
        will-change: auto !important;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        overflow: hidden !important;
        width: 100% !important;
        height: 100% !important;
        background: #000;
        overscroll-behavior: none;
      }
      #root {
        overflow: hidden !important;
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
    <script src="/scroll-fix.js"></script>
    <script>
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
