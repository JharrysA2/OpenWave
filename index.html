<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWave</title>
    <style>
      /* ═══════════════════════════════════════════════════════════════════════
         DM Sans — empaquetada LOCAL (public/fonts): sin dependencia de Google
         Fonts, la app funciona sin conexión y la tipografía es consistente
         (CSP font-src 'self'; antes llegaba un fallback del sistema y "Sin
         conexión con el servidor" se veía con otra fuente).
         ═══════════════════════════════════════════════════════════════════════ */
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/DM-Sans-latin-ext.woff2") format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/DM-Sans-latin.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @property --neon {
        syntax: "<color>";
        inherits: true;
        initial-value: #a78bfa;
      }
      @keyframes sw-fade-slide-up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes sw-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* ═══════════════════════════════════════════════════════════════════════
         KEYFRAMES GLOBALES — SOLO aquí, NUNCA en un <style> de React.
         La CSP de Tauri inyecta un nonce ALEATORIO por carga en `style-src`
         y, al haber nonce, 'unsafe-inline' queda anulado: un <style> creado
         en runtime por React no lleva ese nonce y el navegador lo bloquea
         (su `style.sheet` queda en null y las reglas no se aplican). Este
         <style> del documento sí recibe el nonce al servirse la página.
         Bug real: sw-bg-spin/sw-modal-in vivían en LyricsView.jsx → el fondo
         de Letras NUNCA giraba en la app empaquetada (ver LyricsView.test.jsx).
         ═══════════════════════════════════════════════════════════════════════ */
      @keyframes sw-modal-in {
        from {
          opacity: 0;
          transform: scale(0.92) translateY(20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      /* Rotación lenta del fondo de Letras (settings.lyricsRotateBg). La pausa
         html.perf-anim-off / app-hidden la frena con animation-play-state. */
      @keyframes sw-bg-spin {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }
      /* Apple Design: reduced motion = gentle cross-fades, not instant cuts */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.2s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.15s !important;
        }
        /* Reemplazar slide animations por fade simple */
        @keyframes sw-fade-slide-up {
          from {
            opacity: 0;
            transform: none;
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
      }
      /* Apple Design: reduced transparency = solid backgrounds */
      @media (prefers-reduced-transparency: reduce) {
        .sidebar,
        .player-bar,
        .title-bar {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
      }

      /* ═══════════════════════════════════════════════════════════════════════
         SKELETON SHIMMER — Loading placeholder animation
         ═══════════════════════════════════════════════════════════════════════ */
      @keyframes skeleton-shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.08);
        }
      }
      @keyframes glow-pulse {
        0%,
        100% {
          box-shadow:
            0 0 12px var(--accent-color, #a78bfa) 55,
            0 0 24px var(--accent-color, #a78bfa) 33;
        }
        50% {
          box-shadow:
            0 0 20px var(--accent-color, #a78bfa) 77,
            0 0 40px var(--accent-color, #a78bfa) 44;
        }
      }
      /* ═══════════════════════════════════════════════════════════════════════
         CONNECTION BANNER — punto pulsante mientras se reintenta
         ═══════════════════════════════════════════════════════════════════
         Reutiliza los keyframes `pulse` de arriba. */
      .connection-dot {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .connection-dot {
          animation: none !important;
        }
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.04) 0%,
          rgba(255, 255, 255, 0.08) 50%,
          rgba(255, 255, 255, 0.04) 100%
        );
        background-size: 200% 100%;
        animation: skeleton-shimmer 1.8s ease-in-out infinite;
        border-radius: 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none !important;
          background: rgba(255, 255, 255, 0.06) !important;
        }
      }

      /* ═══════════════════════════════════════════════════════════════════════
         LIQUID GLASS — Player Bar pseudo-element for subtle shine
         ════════════════════════════════════════════════════════════════════ */
      .player-bar {
        position: relative;
      }
      .player-bar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, transparent 100%);
        border-radius: 20px 20px 0 0;
        pointer-events: none;
        z-index: 0;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         PERFORMANCE MODES — applied on <html> by PerformanceContext
         These !important rules override INLINE styles from React.
         ═══════════════════════════════════════════════════════════════════════ */
      html.perf-blur-off *,
      html.perf-blur-off *::before,
      html.perf-blur-off *::after {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        filter: none !important;
      }
      html.perf-anim-off *,
      html.perf-anim-off *::before,
      html.perf-anim-off *::after {
        animation: none !important;
        animation-play-state: paused !important;
      }
      html.perf-shadow-off *,
      html.perf-shadow-off *::before,
      html.perf-shadow-off *::after {
        box-shadow: none !important;
      }
      /* El glow del relleno del player es filter: drop-shadow (así no lo
         aplaste scaleX — ver PlayerBar «progress-fill-glow»). «Sombras»
         debe apagarlo igual que apagaba su box-shadow anterior.
         perf-blur-off ya lo mata con filter: none de serie: es un pase de
         difuminado y ese modo existe justo para eliminarlos. */
      html.perf-shadow-off [style*="drop-shadow"] {
        filter: none !important;
      }
      html.perf-solid [style*="backdrop-filter"] {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: color-mix(in srgb, var(--neon) 18%, var(--bg-base, #0a0a0f)) !important;
      }
      /* SOLID ? buttons keep a visible accent border so they stand out
         against the solid background (GLASS.btn / close buttons use blur(6px)) */
      html.perf-solid [style*="blur(6px)"] {
        border: 1px solid color-mix(in srgb, var(--neon) 45%, rgba(255, 255, 255, 0.35)) !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         APP HIDDEN — window minimized / covered / backgrounded.
         Option A (aggressive): pause/remove ALL effects while music keeps
         playing. Animations resume where they left off (paused, not killed).
         ═══════════════════════════════════════════════════════════════════════ */
      html.app-hidden *,
      html.app-hidden *::before,
      html.app-hidden *::after {
        animation-play-state: paused !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        filter: none !important;
        box-shadow: none !important;
        will-change: auto !important;
      }
      /* EXCEPCIÓN — cristal de modal: un modal abierto es exactamente lo que
         el usuario está mirando; al perder el foco DOM la regla de arriba
         convertía el vidrio esmerilado en transparente de golpe (bug: "los
         modales no tienen blur", reproducido con foco robado el 2026-09-29).
         Solo se salva el `blur(40px)` inline de GLASS.sheet/settings (hojas y
         paneles); shell/player/popup siguen apagándose. Los modos explícitos
         de Rendimiento ganan por el :not() — perf-blur-off/perf-solid tienen
         prioridad sobre la exención. */
      html.app-hidden:not(.perf-blur-off):not(.perf-solid) [style*="blur(40px)"] {
        backdrop-filter: blur(40px) !important;
        -webkit-backdrop-filter: blur(40px) !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         OVERLAY OPEN — un modal/sheet/panel a pantalla completa está montado
         (clase que añade hooks/useOverlayLayer.js).
         Pausa SOLO las animaciones infinitas que quedan debajo del overlay:
         están tapadas por el scrim (nadie las ve), pero cada frame suyo
         invalida el backdrop-filter de las hojas y re-difumina la iGPU.
         ═══════════════════════════════════════════════════════════════════════ */
      html.overlay-open .skeleton,
      html.overlay-open .connection-dot,
      html.overlay-open .now-playing-pulse {
        animation-play-state: paused !important;
      }

      /* Superficies de la shell que quedan DETRÁS del overlay: se apagan sus
         blurs mientras dure el overlay (la clase la gestiona
         hooks/useOverlayLayer.js). El player bar es la EXCEPCIÓN y conserva
         su blur(10px): un player sin desenfoque al lado de los cristales
         esmerilados de los modales se ve incoherente; su coste ≈ 0 porque el
         overlay congela lo que hay detrás (progreso, karaoke, animaciones) y
         con el backdrop estático el compositor cachea el frosted. */
      html.overlay-open .app-sidebar,
      html.overlay-open .app-titlebar,
      html.overlay-open .app-searchbar {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /* ═══════════════════════════════════════════════════════════════════════
         SELECCIÓN DE TEXTO — deshabilitada en TODA la app (estética):
         nada muestra el subrayado azul al arrastrar (canciones, barras,
         letras, menús…). Única excepción: campos editables, donde la
         selección es necesaria para editar (búsquedas, nombres…).
         ═══════════════════════════════════════════════════════════════════════ */
      *,
      *::before,
      *::after {
        user-select: none;
        -webkit-user-select: none;
      }
      input,
      textarea,
      [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
      }
      html,
      body {
        overflow: hidden !important;
        width: 100% !important;
        height: 100% !important;
        background: #000;
        overscroll-behavior: none;
        /* DM Sans local (ver @font-face): toda la UI nace con la tipografía
           real, incluso antes de que React monte (splash) */
        font-family: "DM Sans", system-ui, sans-serif;
      }
      #root {
        overflow: hidden !important;
        width: 100%;
        height: 100%;
        position: relative;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         SPLASH — pantalla de inicio estática (sin JS: se pinta en cuanto se
         parsea este HTML, mucho antes del bundle).
         La oculta src/main.jsx tras el primer paint de React (clase
         `splash-exit` → transition → remove). Si el bundle nunca llega, el
         keyframe de seguridad la desvanece a los 10 s para no dejar la app
         tapada. `pointer-events: none` para que nunca bloquee la UI.
         ═══════════════════════════════════════════════════════════════════════ */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(900px 480px at 50% 28%, #12101d, #050508 70%);
        color: #fff;
        opacity: 1;
        transition: opacity 0.32s ease;
        pointer-events: none;
        /* Entrada + red de seguridad: si el bundle no llega, no deja la app
           tapada (ver splash-failsafe más abajo) */
        animation:
          sw-fade-in 0.25s ease,
          splash-failsafe 0s linear 10s forwards;
      }
      #splash.splash-exit {
        opacity: 0;
      }
      .splash-name {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .splash-track {
        width: 180px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        margin-top: 6px;
      }
      .splash-progress {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #a78bfa;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(370%);
        }
      }
      /* Seguridad: si el bundle no llega, no deja la app tapada para siempre */
      @keyframes splash-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-progress {
          animation: none !important;
          width: 100% !important;
        }
      }
    </style>
    <script src="/scroll-fix.js"></script>
    <script>
      document.addEventListener(
        "contextmenu",
        function (e) {
          e.preventDefault();
        },
        true,
      );
    </script>
  </head>
  <body>
    <!-- Splash: se pinta antes de cargar el bundle y lo retira src/main.jsx
         tras el primer paint de React (sin <script> inline: CSP script-src 'self') -->
    <div id="splash" aria-hidden="true">
      <svg
        width="56"
        height="56"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#a78bfa"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M2 12c1.6 0 1.6-5 3.2-5s1.6 10 3.2 10 1.6-13 3.2-13 1.6 13 3.2 13 1.6-10 3.2-10 1.6 5 3.2 5"
        />
      </svg>
      <div class="splash-name">OpenWave</div>
      <div class="splash-track"><span class="splash-progress"></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
