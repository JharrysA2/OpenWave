<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundWave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @property --neon {
        syntax: "<color>";
        inherits: true;
        initial-value: #a78bfa;
      }
      @keyframes sw-fade-slide-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes sw-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Apple Design: reduced motion = gentle cross-fades, not instant cuts */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.2s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.15s !important;
        }
        /* Reemplazar slide animations por fade simple */
        @keyframes sw-fade-slide-up {
          from { opacity: 0; transform: none; }
          to { opacity: 1; transform: none; }
        }
      }
      /* Apple Design: reduced transparency = solid backgrounds */
      @media (prefers-reduced-transparency: reduce) {
        .sidebar, .player-bar, .title-bar {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
        }
      }

      /* ═══════════════════════════════════════════════════════════════════════
         AURORA MESH GRADIENT — Animated background effect
         ═══════════════════════════════════════════════════════════════════════ */
      @keyframes aurora-drift {
        0% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
        25% { transform: translate(10%, -5%) rotate(15deg) scale(1.1); }
        50% { transform: translate(-5%, 10%) rotate(-10deg) scale(0.95); }
        75% { transform: translate(-10%, -8%) rotate(5deg) scale(1.05); }
        100% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
      }
      @keyframes aurora-drift-2 {
        0% { transform: translate(0%, 0%) rotate(0deg) scale(1.05); }
        25% { transform: translate(-8%, 8%) rotate(-12deg) scale(1.15); }
        50% { transform: translate(12%, -3%) rotate(8deg) scale(0.9); }
        75% { transform: translate(5%, 12%) rotate(-5deg) scale(1.1); }
        100% { transform: translate(0%, 0%) rotate(0deg) scale(1.05); }
      }
      @keyframes aurora-drift-3 {
        0% { transform: translate(0%, 0%) rotate(0deg) scale(0.95); }
        25% { transform: translate(15%, 5%) rotate(20deg) scale(1.08); }
        50% { transform: translate(-8%, -12%) rotate(-15deg) scale(1.12); }
        75% { transform: translate(-12%, 8%) rotate(10deg) scale(0.92); }
        100% { transform: translate(0%, 0%) rotate(0deg) scale(0.95); }
      }
      .aurora-layer {
        position: absolute;
        inset: -50%;
        width: 200%;
        height: 200%;
        border-radius: 50%;
        filter: blur(80px) saturate(150%);
        will-change: transform;
        pointer-events: none;
      }
      .aurora-1 {
        background: radial-gradient(ellipse at center, var(--aurora-1) 0%, transparent 70%);
        animation: aurora-drift 20s ease-in-out infinite;
      }
      .aurora-2 {
        background: radial-gradient(ellipse at center, var(--aurora-2) 0%, transparent 70%);
        animation: aurora-drift-2 25s ease-in-out infinite;
      }
      .aurora-3 {
        background: radial-gradient(ellipse at center, var(--aurora-3) 0%, transparent 70%);
        animation: aurora-drift-3 30s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .aurora-layer { animation: none !important; }
      }

      /* ═══════════════════════════════════════════════════════════════════════
         SKELETON SHIMMER — Loading placeholder animation
         ═══════════════════════════════════════════════════════════════════════ */
      @keyframes skeleton-shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 12px var(--accent-color, #a78bfa) 55, 0 0 24px var(--accent-color, #a78bfa) 33; }
        50% { box-shadow: 0 0 20px var(--accent-color, #a78bfa) 77, 0 0 40px var(--accent-color, #a78bfa) 44; }
      }
      /* ═══════════════════════════════════════════════════════════════════════
         CONNECTION BANNER — punto pulsante mientras se reintenta
         ═══════════════════════════════════════════════════════════════════
         Reutiliza los keyframes `pulse` de arriba. */
      .connection-dot {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .connection-dot { animation: none !important; }
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          rgba(255,255,255,.04) 0%,
          rgba(255,255,255,.08) 50%,
          rgba(255,255,255,.04) 100%
        );
        background-size: 200% 100%;
        animation: skeleton-shimmer 1.8s ease-in-out infinite;
        border-radius: 8px;
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton { animation: none !important; background: rgba(255,255,255,.06) !important; }
      }

      /* ═══════════════════════════════════════════════════════════════════════
         LIQUID GLASS — Player Bar pseudo-element for subtle shine
         ════════════════════════════════════════════════════════════════════ */
      .player-bar {
        position: relative;
      }
      .player-bar::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40%;
        background: linear-gradient(
          180deg,
          rgba(255,255,255,.06) 0%,
          transparent 100%
        );
        border-radius: 20px 20px 0 0;
        pointer-events: none;
        z-index: 0;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        overflow: hidden !important;
        width: 100% !important;
        height: 100% !important;
        background: #000;
        overscroll-behavior: none;
      }
      #root {
        overflow: hidden !important;
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
    <script src="/scroll-fix.js"></script>
    <script>
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
