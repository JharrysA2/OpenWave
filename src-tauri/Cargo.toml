[package]
name = "openwave"
version = "1.0.0"
description = "OpenWave Music App"
authors = []
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"
# Para SetCurrentProcessExplicitAppUserModelID (agrupación en la barra de
# tareas y el Administrador de Tareas: WebView2 → «OpenWave»).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
